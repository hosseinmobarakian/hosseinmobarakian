name: Update README cards

on:
  schedule:
    - cron: "0 0 * * *"        # Runs daily at midnight UTC
  workflow_dispatch:           # Allows manual trigger from Actions tab

jobs:
  build:
    runs-on: ubuntu-latest
    permissions:
      contents: write          # Required to commit the SVG files back to the repo

    steps:
      - uses: actions/checkout@v6

      # ------------------------------------------------
      # 1. FULL STATS CARD (private repos included, rank hidden)
      # ------------------------------------------------
      - name: Generate full stats card
        uses: stats-organization/github-readme-stats-action@v2
        with:
          card: stats
          options: username=${{ github.repository_owner }}&show_icons=true&count_private=true&hide_rank=true
          path: profile/stats.svg
          token: ${{ secrets.GH_TOKEN }}

      # ------------------------------------------------
      # 2. TOP LANGUAGES CARD (compact layout, private repos included)
      # ------------------------------------------------
      - name: Generate top languages card
        uses: stats-organization/github-readme-stats-action@v2
        with:
          card: top-langs
          options: username=${{ github.repository_owner }}&layout=compact&langs_count=6&count_private=true
          path: profile/top-langs.svg
          token: ${{ secrets.GH_TOKEN }}

      # ------------------------------------------------
      # 3. COMMIT THE GENERATED CARDS
      # ------------------------------------------------
      - name: Commit cards
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add profile/*.svg
          git commit -m "Update README cards" || exit 0
          git push